id: 103
module: 6
module_name: functions
module_display: Functions
title: Return a Status
difficulty: intermediate
xp: 110
story: |
  Priya is building a cron job that watches disk usage and wants its answer as a
  status code, the way every Unix tool reports back: 0 means "fine", anything else
  means "look at me", and different numbers can say different things. You are
  writing the checker she will plug in.
objective: |
  Write solution.sh. It takes one argument: a disk usage percentage (a whole
  number). Define a function named check_disk that takes that percentage and uses
  the return command to give back a status:
    below 80        return 0
    80 to 94        return 1
    95 or more      return 2
  The function prints nothing. After calling it, the script saves the status in a
  variable and prints:
    disk <PCT>% -> status <N>
  and then exits with that same status number (exit "$code").
  Do not use set -e in this script: a non-zero return would stop it early.
concepts:
  - "return N ends the function with a status"
  - "$? holds the status of the last command, including a function"
required_patterns:
  - pattern: '(^|\n)\s*(function\s+)?check_disk\s*(\(\s*\))?\s*\{'
    message: "Define a function called check_disk."
  - pattern: '\breturn\s+[0-9]'
    message: "Give the status back with return, for example: return 1"
  - pattern: '\$\?'
    message: "Read the status of the call from $? right after calling the function."
forbidden_patterns:
  - pattern: 'set\s+-[a-z]*e'
    message: "Leave set -e out here: return 1 or 2 would stop the script before it prints."
test_cases:
  - name: healthy disk
    args: ["42"]
    expected_stdout: "disk 42% -> status 0"
    expected_exit: 0
  - name: getting full
    args: ["80"]
    expected_stdout: "disk 80% -> status 1"
    expected_exit: 1
  - name: just below critical
    args: ["94"]
    expected_stdout: "disk 94% -> status 1"
    expected_exit: 1
  - name: critical
    args: ["97"]
    expected_stdout: "disk 97% -> status 2"
    expected_exit: 2
  - name: edge at 79
    args: ["79"]
    expected_stdout: "disk 79% -> status 0"
    expected_exit: 0
