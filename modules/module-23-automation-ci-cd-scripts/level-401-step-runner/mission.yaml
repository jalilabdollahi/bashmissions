id: 401
module: 23
module_name: automation-ci-cd-scripts
module_display: Build & Deploy
title: Step Runner
difficulty: advanced
xp: 260
story: |
  Lanternfish ships every day, and Theo's release "pipeline" is a text file of
  commands pasted into a terminal. Last Friday the tests failed, nobody noticed,
  and the deploy step ran anyway. Mara wants a tiny step runner that treats a
  failing step as a full stop, the way every real CI system does.
objective: |
  Write solution.sh, called with a list of step scripts: `solution.sh STEP...`.
  Run the steps in the order given, each with `bash STEP`. Before each step
  print (to stdout):
    step N/TOTAL: <step file name>
  where N counts from 1 and TOTAL is the number of arguments.
  If a step exits non-zero, stop at once: do not run the remaining steps,
  print `FAILED at step N: <step file name> (exit CODE)` to stderr, and exit
  with that same CODE.
  If every step succeeds, print `pipeline passed: TOTAL step(s)` and exit 0.
  With no arguments print `usage: solution.sh STEP...` to stderr and exit 2.
  Your script must keep `set -e` on and still handle the failing step itself,
  so no step after a failure ever runs.
concepts:
  - "stop on the first failing step"
  - "if ! cmd; then rc=$?; ... fi  and  cmd || rc=$?  under set -e"
  - "pass a child's exit status on as your own"
required_patterns:
  - pattern: '\bset\s+-[a-z]*e'
    message: "Keep `set -e` (or -euo pipefail) on; handle each step's status explicitly."
test_cases:
  - name: all steps pass
    args: [lint.sh, test.sh, build.sh]
    files:
      lint.sh: "echo lint >> .trace"
      test.sh: "echo test >> .trace"
      build.sh: "echo build >> .trace"
    expected_stdout: |-
      step 1/3: lint.sh
      step 2/3: test.sh
      step 3/3: build.sh
      pipeline passed: 3 step(s)
    expected_files:
      .trace: |
        lint
        test
        build
  - name: second step fails, third never runs
    args: [lint.sh, test.sh, deploy.sh]
    files:
      lint.sh: "echo lint >> .trace"
      test.sh: "echo test >> .trace; exit 7"
      deploy.sh: "echo deploy >> .trace"
    expected_stdout: |-
      step 1/3: lint.sh
      step 2/3: test.sh
    expected_stderr: "FAILED at step 2: test.sh (exit 7)"
    expected_exit: 7
    expected_files:
      .trace: |
        lint
        test
  - name: the very first step fails
    args: [bad.sh, never.sh]
    files:
      bad.sh: "exit 1"
      never.sh: "echo oops >> .trace"
    expected_stdout: "step 1/2: bad.sh"
    expected_stderr: "FAILED at step 1: bad.sh (exit 1)"
    expected_exit: 1
    expected_files:
      .trace: null
  - name: a missing step file counts as a failure
    args: [ok.sh, ghost.sh, after.sh]
    files:
      ok.sh: "echo ok >> .trace"
      after.sh: "echo after >> .trace"
    expected_stdout: |-
      step 1/3: ok.sh
      step 2/3: ghost.sh
    expected_stderr: "FAILED at step 2: ghost.sh (exit 127)"
    stderr_comparison: contains
    expected_exit: 127
    expected_files:
      .trace: |
        ok
  - name: no steps given
    expected_stderr: "usage: solution.sh STEP..."
    expected_exit: 2
