id: 415
module: 23
module_name: automation-ci-cd-scripts
module_display: Build & Deploy
title: Promote Between Environments
difficulty: expert
xp: 400
story: |
  Lanternfish has three environments, dev, staging and prod, and a single rule
  about them: a version reaches prod only by living in staging first, and only
  after Priya has approved it. Last quarter Theo deployed straight from his
  laptop to prod and, by accident, an older build over a newer one. Each
  environment keeps a file naming what it runs. A promotion script should read
  those files and enforce the rules, so the rules stop depending on people.
objective: |
  Write solution.sh, called as `solution.sh FROM TO`. The environments, in
  order, are `dev staging prod`. The file `versions/ENV` contains the version
  (`MAJOR.MINOR.PATCH`) that ENV currently runs.
  Checks, in this order; each failure prints its message to stderr, exits and
  changes nothing:
    1. FROM or TO is not one of the three names, or an argument is missing:
         usage: solution.sh FROM TO   (environments: dev staging prod)    exit 2
    2. TO is not exactly the next environment after FROM:
         cannot promote FROM to TO                                        exit 2
    3. `versions/FROM` is missing, empty, or not a version:
         nothing deployable in FROM                                       exit 1
    4. TO already runs that version: print `TO already runs VERSION` to
       stdout and exit 0 (no deploy).
    5. `versions/TO` exists and is a NEWER version than the one being
       promoted: refusing to downgrade TO from CURRENT to VERSION        exit 1
       (compare the numbers part by part: 1.10.0 is newer than 1.9.0).
    6. TO is `prod` and the file `approvals/VERSION` does not exist:
         VERSION is not approved for prod                                 exit 1
  Then run `deployctl deploy --env TO --version VERSION`. If it fails print
  `deploy to TO failed` to stderr and exit 1, leaving `versions/TO` as it was.
  If it succeeds write VERSION to `versions/TO` (one line) and print
  `promoted VERSION: FROM -> TO`.
concepts:
  - "an ordered pipeline of stages as an array and its indexes"
  - "compare version numbers part by part (no sort -V)"
  - "update state only after the action succeeded"
test_cases:
  - name: dev to staging
    args: [dev, staging]
    files:
      versions/dev: "1.4.0\n"
      versions/staging: "1.3.2\n"
    expected_stdout: "promoted 1.4.0: dev -> staging"
    expected_files:
      versions/staging: "1.4.0"
      .calls.log: "deployctl deploy --env staging --version 1.4.0"
  - name: staging to prod with an approval
    args: [staging, prod]
    files:
      versions/staging: "1.4.0\n"
      versions/prod: "1.3.2\n"
      approvals/1.4.0: "priya\n"
    expected_stdout: "promoted 1.4.0: staging -> prod"
    expected_files:
      versions/prod: "1.4.0"
  - name: first ever deploy to an empty environment
    args: [dev, staging]
    files:
      versions/dev: "0.1.0\n"
    expected_stdout: "promoted 0.1.0: dev -> staging"
    expected_files:
      versions/staging: "0.1.0"
  - name: prod without approval
    args: [staging, prod]
    files:
      versions/staging: "1.4.0\n"
      versions/prod: "1.3.2\n"
    expected_stderr: "1.4.0 is not approved for prod"
    expected_exit: 1
    expected_files:
      versions/prod: "1.3.2"
      .calls.log: null
  - name: no skipping stages
    args: [dev, prod]
    files:
      versions/dev: "1.4.0\n"
    expected_stderr: "cannot promote dev to prod"
    expected_exit: 2
  - name: promoting backwards is not a thing
    args: [prod, staging]
    files:
      versions/prod: "1.4.0\n"
    expected_stderr: "cannot promote prod to staging"
    expected_exit: 2
  - name: already there
    args: [dev, staging]
    files:
      versions/dev: "2.0.0\n"
      versions/staging: "2.0.0\n"
    expected_stdout: "staging already runs 2.0.0"
    expected_files:
      .calls.log: null
  - name: an older version must not replace a newer one
    args: [dev, staging]
    files:
      versions/dev: "1.9.0\n"
      versions/staging: "1.10.0\n"
    expected_stderr: "refusing to downgrade staging from 1.10.0 to 1.9.0"
    expected_exit: 1
    expected_files:
      versions/staging: "1.10.0"
      .calls.log: null
  - name: the deploy fails and the record stays
    args: [dev, staging]
    env: {FAKE_DEPLOY_FAIL: staging}
    files:
      versions/dev: "1.5.0\n"
      versions/staging: "1.4.0\n"
    expected_stderr: "deploy to staging failed"
    stderr_comparison: contains
    expected_exit: 1
    expected_files:
      versions/staging: "1.4.0"
  - name: nothing to promote
    args: [dev, staging]
    files:
      versions/dev: "\n"
    expected_stderr: "nothing deployable in dev"
    expected_exit: 1
  - name: unknown environment
    args: [qa, staging]
    expected_stderr: "usage: solution.sh FROM TO   (environments: dev staging prod)"
    expected_exit: 2
