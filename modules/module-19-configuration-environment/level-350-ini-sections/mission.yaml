id: 350
module: 19
module_name: configuration-environment
module_display: Configuration
title: INI Sections
difficulty: advanced
xp: 270
story: |
  The flat `key=value` files are not enough any more. Noor's new control panel
  writes one INI file per customer with a `[web]` part, a `[mail]` part and a
  `[backup]` part, and both the web and the mail part have a `port`. Asking
  "what is the port?" now has two answers, and the old grep one-liners return
  the wrong one about half of the time. You need a lookup that knows which
  section it is in.
objective: |
  Write solution.sh, called as `solution.sh FILE SECTION KEY`. It prints the
  value of KEY inside the section named SECTION, followed by a newline.
  INI rules:
    - a line `[name]` starts the section `name` (blanks around the line are
      ignored; names are case-sensitive and may contain dots or spaces)
    - lines starting with `#` or `;` (after optional blanks) and blank lines are
      comments; there are no inline comments, so `#` or `;` later in a value is
      part of the value
    - a setting is `key=value`; blanks around the key and around the value are
      removed; the value is everything after the first `=`
    - settings that appear before any section header belong to no section
    - a section may appear more than once, and a key may repeat: the last
      definition wins
  If the key is not defined in that section (or the section does not exist),
  print `missing key KEY in [SECTION]` to stderr and exit 1. An unreadable FILE
  prints `cannot read FILE` and exits 2. Anything other than exactly three
  arguments prints `usage: solution.sh FILE SECTION KEY` to stderr and exits 2.
concepts:
  - "parse [section] headers with a state variable"
  - "regex ^\\[(.*)\\]$ and BASH_REMATCH"
  - "the same key name in different sections"
test_cases:
  - name: same key in two sections
    args: [site.ini, mail, port]
    files:
      site.ini: |
        [web]
        port=8080
        host=harbour.example

        [mail]
        port=25
        host=mx.harbour.example
    expected_stdout: "25"
  - name: comments, blanks, last definition wins, dotted section
    args: [site.ini, mail.relay, host]
    files:
      site.ini: |
        ; generated by the control panel
        [mail.relay]
          host = smtp.one.example
        # host=commented.example
        [web]
        host=web.example
        [mail.relay]
        host   =   smtp.two.example
    expected_stdout: "smtp.two.example"
  - name: values keep their equals signs, hashes and semicolons
    args: [site.ini, web, url]
    files:
      site.ini: |
        [web]
        url = https://harbour.example/shop?lang=en&cur=eur#top; v=2
    expected_stdout: "https://harbour.example/shop?lang=en&cur=eur#top; v=2"
  - name: settings before any section belong to no section
    args: [site.ini, web, name]
    files:
      site.ini: |
        name=global
        [web]
        port=1
    expected_stderr: "missing key name in [web]"
    expected_exit: 1
  - name: section names are case-sensitive
    args: [site.ini, web, port]
    files:
      site.ini: |
        [Web]
        port=9999
        [web]
        port=80
    expected_stdout: "80"
  - name: unknown section
    args: [site.ini, backup, retention]
    files:
      site.ini: "[web]\nretention=3\n"
    expected_stderr: "missing key retention in [backup]"
    expected_exit: 1
  - name: unreadable file
    args: [gone.ini, web, port]
    expected_stderr: "cannot read gone.ini"
    expected_exit: 2
  - name: wrong number of arguments
    args: [site.ini, web]
    files:
      site.ini: "[web]\nport=1\n"
    expected_stderr: "usage: solution.sh FILE SECTION KEY"
    expected_exit: 2
