      \    stale (> 5 min)\n== Fleet == [1/2 up]\n  \e[32mUP      \e[0m buoy-link!     port open\n  \e[31mDOWN    \e[0m halibut-ssh    connection refused\n== Back office == [1/3 up]\n  \e[33mDEGRADED\e[0m\
