    expected_exit: 1
  - name: connection failure and missing heartbeat
    args:
    - services.conf
    files:
      services.conf: |
        Edge|proxy|http|https://proxy.lanternfish.example/|200
        Edge|heartbeat|file|feeds/missing.stamp|10
      http/proxy.lanternfish.example/.fail: ''
    expected_stdout: |-
      == Lanternfish Status Board ==
      == Edge == [0/2 up]
        DOWN     proxy          no response
        DOWN     heartbeat      missing
      overall: DEGRADED (2 down, 0 degraded, 0 up)
    expected_exit: 1
  - name: unknown type stops everything
    args:
    - services.conf
    files:
      services.conf: |
        # comment
        Edge|proxy|http|https://proxy.lanternfish.example/|200
        Edge|pager|smoke-signal|north|-
    expected_stdout: ''
    expected_stderr: 'error: services.conf line 3: unknown type ''smoke-signal'''
    expected_exit: 3
  - name: too few fields
    args:
    - services.conf
    files:
      services.conf: |
        Edge|proxy|http|https://x.example/
    expected_stdout: ''
    expected_stderr: 'error: services.conf line 1: need GROUP|NAME|TYPE|TARGET|ARG'
    expected_exit: 3
  - name: no config
    args:
    - nope.conf
    expected_stdout: ''
    expected_stderr: 'error: cannot read nope.conf'
    expected_exit: 2
