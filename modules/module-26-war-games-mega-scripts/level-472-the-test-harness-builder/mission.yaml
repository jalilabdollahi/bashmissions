    expected_stdout: |-
      tests/math.test.sh
        PASS test_reads_value
        FAIL test_wrong_total: expected '41' but got '40'
      summary: 2 tests, 1 passed, 1 failed, 0 skipped
    expected_exit: 1
    expected_files:
      tests/teardown.log: |-
        done
        done
  - name: tests cannot leak state into each other
    args:
    - tests
    files:
      tests/a.test.sh: |
        test_writes_a_file() { echo secret > leak.txt; assert_success test -f leak.txt; }
      tests/b.test.sh: |
        test_starts_clean() { [[ ! -e leak.txt ]] || fail "state leaked from the previous test"; }
        test_test_dir_is_absolute() { [[ $TEST_DIR == /* ]] || fail "TEST_DIR is $TEST_DIR"; assert_success test -f "$TEST_DIR/b.test.sh"; }
    expected_stdout: |-
      tests/a.test.sh
        PASS test_writes_a_file
      tests/b.test.sh
        PASS test_starts_clean
        PASS test_test_dir_is_absolute
      summary: 3 tests, 3 passed, 0 failed, 0 skipped
  - name: a broken file is reported and does not stop the others
    args:
    - tests
    files:
      tests/a.test.sh: |
        test_fine() { :; }
      tests/b.test.sh: |
        test_oops() { echo "unclosed
      tests/c.test.sh: |
        test_also_fine() { assert_eq a a; }
    expected_stdout: |-
      tests/a.test.sh
        PASS test_fine
      tests/b.test.sh
        ERROR syntax error
      tests/c.test.sh
        PASS test_also_fine
      summary: 2 tests, 2 passed, 0 failed, 0 skipped
      file errors: 1
    expected_exit: 1
  - name: an empty file means no tests
    args:
    - tests/none.test.sh
    files:
      tests/none.test.sh: |
        echo no tests here
    expected_stdout: ''
    expected_stderr: 'error: no tests found'
    expected_exit: 2
  - name: unreadable path
    args:
    - tests/missing.test.sh
    expected_stdout: ''
    expected_stderr: 'error: cannot read tests/missing.test.sh'
    expected_exit: 2
  - name: usage
    args: []
    expected_stdout: ''
    expected_stderr: 'usage: solution.sh [--filter TEXT] [--fail-fast] [--verbose] PATH...'
    expected_exit: 2
