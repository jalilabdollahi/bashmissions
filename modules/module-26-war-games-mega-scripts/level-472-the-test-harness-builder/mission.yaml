        }
        test_status() { assert_status 3 bash -c 'exit 3'; }
        test_status_wrong() { assert_status 0 bash -c 'exit 4'; }
        test_success_fails() { assert_success test -e nothing-here; }
        helper_not_a_test() { :; }
        test_manual_fail() { fail "manual failure
        second line"; }
    expected_stdout: |-
      tests/math.test.sh
        PASS test_reads_value
        FAIL test_wrong_total: expected '41' but got '40'
          | setup ran
        PASS test_contains
        FAIL test_missing_word: 'harbour bakery' does not contain 'pub'
          | setup ran
        SKIP test_skipped (needs the ferry)
        FAIL test_command_dies: exited with status 1
          | setup ran
          | about to fail
        PASS test_status
        FAIL test_status_wrong: expected status 0 but got 4 from: bash -c exit 4
          | setup ran
        FAIL test_success_fails: command failed (status 1): test -e nothing-here
          | setup ran
        FAIL test_manual_fail: manual failure
          | setup ran
      summary: 10 tests, 3 passed, 6 failed, 1 skipped
    expected_exit: 1
  - name: filter picks tests by name
    args:
    - --filter
    - status
    - tests/math.test.sh
    files:
      tests/math.test.sh: |
