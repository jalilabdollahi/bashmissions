        helper_not_a_test() { :; }
        test_manual_fail() { fail "manual failure
        second line"; }
    expected_stdout: |-
      tests/math.test.sh
        PASS test_status
        FAIL test_status_wrong: expected status 0 but got 4 from: bash -c exit 4
      summary: 2 tests, 1 passed, 1 failed, 0 skipped
    expected_exit: 1
  - name: fail-fast stops at the first failure
    args:
    - --fail-fast
    - tests/math.test.sh
    files:
      tests/math.test.sh: |
        #!/usr/bin/env bash
        setup() { echo 40 > value.txt; echo "setup ran"; }
        teardown() { echo done >> "$TEST_DIR/teardown.log"; }

        test_reads_value() {
          local v
