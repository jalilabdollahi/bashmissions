        echo "no header here"
      plugins/dupe.plugin: |
        # name: core
      plugins/disabled.list: |
        shout-out
    expected_stdout: |-
      == hook pre_deploy ==
      metrics: no hook
      [core] checking disk
      core: ok
      paging
      pager: FAILED (status 9)
      orphan: skipped (missing dependency: ghost)
      shout-out: skipped (disabled)
      [tides] syncing tides
      tides: FAILED (status 3)
      webcam: skipped (needs tides which failed)
      ran: 1, failed: 2, skipped: 3, no hook: 1
    expected_exit: 1
  - name: arguments reach the plugins and nothing leaks between them
