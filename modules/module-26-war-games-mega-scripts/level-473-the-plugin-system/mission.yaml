  - name: custom plugin directory with one calm plugin
    args:
    - --plugins
    - extras
    - run
    - pre_deploy
    files:
      extras/hello.plugin: |
        # name: hello
        hello__pre_deploy() { host_log "hello from extras"; }
    expected_stdout: |-
      == hook pre_deploy ==
      [hello] hello from extras
      hello: ok
      ran: 1, failed: 0, skipped: 0, no hook: 0
  - name: plugin side effects are isolated
    args:
    - run
    - pre_deploy
    files:
      plugins/one.plugin: |
        # name: one
        one__pre_deploy() { cd "$TMPDIR"; MARKER=one; echo "$MARKER" > marker.txt; echo "one wrote the marker"; }
      plugins/two.plugin: |
        # name: two
        # requires: one
        two__pre_deploy() {
          [[ $PWD == "$TMPDIR" ]] && echo "cwd leaked" || echo "cwd is clean"
          echo "marker variable: ${MARKER:-unset}"
          test -f "$TMPDIR/marker.txt" && echo "marker file visible"
          return 0
        }
    expected_stdout: |-
      == hook pre_deploy ==
      one wrote the marker
      one: ok
      cwd is clean
      marker variable: unset
      marker file visible
      two: ok
      ran: 2, failed: 0, skipped: 0, no hook: 0
