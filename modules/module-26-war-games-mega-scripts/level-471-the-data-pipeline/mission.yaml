  - name: a clean file exits 0
    args:
    - inbox
    files:
      inbox/clean.csv: |
        order_id,customer,sku,qty,unit_price,date
        C1,Pier 9 Cafe,bait-05,12,1.25,2026-11-12
        C2,Pier 9 Cafe,rope-10,1,12.50,2026-11-12
    expected_stdout: |-
      clean.csv: 2 rows, 2 loaded, 0 rejected, 0 duplicate
      total: 1 files, 2 rows, 2 loaded, 0 rejected, 0 duplicates, revenue 27.50
      quarantined: 0, already processed: 0
    expected_files:
      db/orders.psv: |-
        C1|Pier 9 Cafe|BAIT-05|12|15.00|2026-11-12
        C2|Pier 9 Cafe|ROPE-10|1|12.50|2026-11-12
      state/processed.list: 856857855 126 clean.csv
      rejects/clean.csv.rej: null
  - name: second run finds nothing to do
    args:
    - inbox
    files:
      inbox/README: |
        no csv here
    expected_stdout: inbox is empty
  - name: only a header
    args:
    - inbox
    files:
      inbox/empty.csv: |
        order_id,customer,sku,qty,unit_price,date
    expected_stdout: |-
      empty.csv: 0 rows, 0 loaded, 0 rejected, 0 duplicate
      total: 1 files, 0 rows, 0 loaded, 0 rejected, 0 duplicates, revenue 0.00
      quarantined: 0, already processed: 0
    expected_files:
      db/orders.psv: ''
      archive/empty.csv: order_id,customer,sku,qty,unit_price,date
  - name: not a directory
    args:
    - nowhere
    expected_stdout: ''
    expected_stderr: 'error: cannot read nowhere'
    expected_exit: 2
  - name: usage
    args: []
    expected_stdout: ''
    expected_stderr: 'usage: solution.sh [--dry-run] INBOX'
