        log.level = warn
        db.port = 5433
        cache.enabled = No
      conf/local.conf: |
        db.password = it's-a-secret
        app.name = Lantern "Harbour"
      conf/typo.conf: |
        db.hots = dory
        this line is wrong
        db.host = dory
        db.password = x
    expected_stdout: ''
    expected_stderr: |-
      config error: unknown key 'db.hots' in conf/typo.conf:1
      config error: bad line in conf/typo.conf:2: expected key = value
      config error: unknown key 'colour' in --set
      config error: bad --set 'novalue': expected KEY=VALUE
    expected_exit: 1
  - name: yes and 1 are booleans
