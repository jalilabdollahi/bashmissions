    - conf/typo.conf
    - --set
    - colour=blue
    - --set
    - novalue
    - schema.txt
    - show
    files:
      schema.txt: |
        # KEY|TYPE|DEFAULT|FLAGS|DESCRIPTION
        app.name|string|lantern|-|Application name
        db.host|string||required|Database host
        db.port|port|5432|-|Database port
        db.password|string||secret,required|Database password
        log.level|enum:debug,info,warn|info|-|Log level
