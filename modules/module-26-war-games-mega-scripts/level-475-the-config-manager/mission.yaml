        log.level = warn
        db.port = 5433
        cache.enabled = No
      conf/local.conf: |
        db.password = it's-a-secret
        app.name = Lantern "Harbour"
    expected_stdout: |-
      {
        "app.name": "Lantern \"Harbour\"",
        "db.host": "localhost",
        "db.port": 5432,
        "log.level": "info",
        "cache.enabled": true,
        "workers": 2
