        workers = 2
      conf/prod.conf: |
        # production
        db.host = dory.lanternfish.example
        log.level = warn
        db.port = 5433
        cache.enabled = No
      conf/local.conf: |
        db.password = it's-a-secret
        app.name = Lantern "Harbour"
    expected_stdout: |-
      STORM_APP_NAME=lantern
      STORM_DB_HOST=localhost
      STORM_DB_PORT=5432
      STORM_DB_PASSWORD=changeme
      STORM_LOG_LEVEL=info
      STORM_CACHE_ENABLED=true
      STORM_WORKERS=16
  - name: validation reports every problem at once
    args:
    - --layer
    - conf/bad.conf
    - --set
    - log.level=LOUD
    - schema.txt
    - validate
    env:
      APP_CACHE_ENABLED: maybe
    files:
      schema.txt: |
        # KEY|TYPE|DEFAULT|FLAGS|DESCRIPTION
        app.name|string|lantern|-|Application name
        db.host|string||required|Database host
        db.port|port|5432|-|Database port
        db.password|string||secret,required|Database password
        log.level|enum:debug,info,warn|info|-|Log level
        cache.enabled|bool|true|-|Use the cache
        workers|int|4|-|Worker processes
      conf/defaults.conf: |
        db.host = localhost
        db.password = "changeme"
        workers = 2
      conf/prod.conf: |
        # production
        db.host = dory.lanternfish.example
        log.level = warn
        db.port = 5433
        cache.enabled = No
      conf/local.conf: |
        db.password = it's-a-secret
        app.name = Lantern "Harbour"
      conf/bad.conf: |
        db.port = 70000
        workers = lots
        db.host =
    expected_stdout: ''
    expected_stderr: |-
      config error: db.host: required but not set
      config error: db.port: '70000' is not a valid port (1-65535)
      config error: db.password: required but not set
      config error: log.level: 'LOUD' is not one of debug, info, warn
      config error: cache.enabled: 'maybe' is not a boolean
      config error: workers: 'lots' is not an integer
    expected_exit: 1
  - name: valid config
    args:
    - --layer
    - conf/defaults.conf
    - schema.txt
    - validate
    files:
      schema.txt: |
        # KEY|TYPE|DEFAULT|FLAGS|DESCRIPTION
        app.name|string|lantern|-|Application name
        db.host|string||required|Database host
        db.port|port|5432|-|Database port
        db.password|string||secret,required|Database password
