id: 256
module: 14
module_name: text-processing-in-scripts
module_display: Text Processing
title: Translate Characters
difficulty: intermediate
xp: 140
story: |
  Theo is wiring every Lanternfish service into the new config system, and it
  only accepts environment variable names in shouting capitals with
  underscores: no dots, no dashes, no lowercase. The service list uses names like
  `tidewater-books.api`. He has forty of them and is not going to retype them.
objective: |
  Write solution.sh. It reads service names from standard input, one per
  line, and prints for each one an environment variable name:
    - every lowercase letter becomes the uppercase letter
    - every `.` becomes `_`
    - every `-` becomes `_`
  Everything else (digits, capitals, other characters) stays as it is.
    tidewater-books.api  ->  TIDEWATER_BOOKS_API
  Empty input prints nothing. Do it with a single tr command: no sed, no awk, no
  ${var^^}.
concepts:
  - "tr SET1 SET2 maps characters one-to-one"
  - "ranges like a-z and A-Z"
required_patterns:
  - pattern: '\btr\b'
    message: "Use tr to translate the characters."
  - pattern: '\btr\s+.*a-z'
    message: "Map the lowercase range a-z to the uppercase range A-Z."
forbidden_patterns:
  - pattern: '\b(sed|awk)\b|\^\^'
    message: "This level is about tr; leave sed, awk and ${var^^} for other jobs."
test_cases:
  - name: dashes and dots
    stdin: |
      tidewater-books.api
      harbour-bakery.web
    expected_stdout: |-
      TIDEWATER_BOOKS_API
      HARBOUR_BAKERY_WEB
  - name: digits and capitals survive
    stdin: |
      Old-Mill.cycles2
      db-01.east.7
      ALREADY.LOUD
    expected_stdout: |-
      OLD_MILL_CYCLES2
      DB_01_EAST_7
      ALREADY_LOUD
  - name: no input
    stdin: ""
    expected_stdout: ""
