id: 387
module: 22
module_name: logging-monitoring-scripts
module_display: Logging & Monitoring
title: Structured Logs
difficulty: intermediate
xp: 150
story: |
  Priya is building a log search for the whole fleet, and she is blunt about
  free-form sentences: "I can't query 'user ada logged in from the office'. I can
  query user=ada." She asks you to write the function that every Lanternfish
  script will use to emit log lines in `key=value` form.
objective: |
  Write solution.sh: `solution.sh LEVEL MESSAGE [key=value ...]`.

  Print one line:

      time=2026-03-01T10:00:00Z level=warn msg="disk is filling" host=eel pct=91

  - `time=` is the value of the environment variable NOW if it is set,
    otherwise the current UTC time as `YYYY-MM-DDThh:mm:ssZ`.
  - `level=` is LEVEL in lowercase, and must be debug, info, warn or error
    (any capitalisation is accepted). Anything else: print
    `bad level: LEVEL` to stderr, exit 2.
  - `msg=` is MESSAGE inside double quotes; a double quote inside the message
    is written as `\"`.
  - Every extra argument must look like `key=value` and is copied after
    msg. If the value contains a space it is wrapped in double quotes
    (`site="Harbour Bakery"`). An argument without `=` prints
    `bad field: ARG` to stderr and exits 2.
  - With fewer than two arguments print `usage: solution.sh LEVEL MESSAGE [key=value ...]` to stderr, exit 2.
concepts:
  - "key=value (logfmt) lines are easy to grep and parse"
  - "${var,,} lowercases, ${var//old/new} replaces"
  - "quote values only when they need it"
required_patterns:
  - pattern: '\$\{[A-Za-z_0-9]+,,\}'
    message: "Lowercase the level with ${var,,}."
test_cases:
  - name: plain fields
    env: {NOW: "2026-03-01T10:00:00Z"}
    args: [WARN, "disk is filling", host=eel, pct=91]
    expected_stdout: 'time=2026-03-01T10:00:00Z level=warn msg="disk is filling" host=eel pct=91'
  - name: value with a space is quoted
    env: {NOW: "2026-03-01T10:05:09Z"}
    args: [info, "invoice sent", "site=Harbour Bakery", amount=42.50]
    expected_stdout: 'time=2026-03-01T10:05:09Z level=info msg="invoice sent" site="Harbour Bakery" amount=42.50'
  - name: quote inside the message is escaped
    env: {NOW: "2026-03-01T11:00:00Z"}
    args: [Error, 'user typed "root" twice']
    expected_stdout: 'time=2026-03-01T11:00:00Z level=error msg="user typed \"root\" twice"'
  - name: current time when NOW is not set
    args: [debug, tick, n=1]
    comparison: regex
    expected_stdout: 'time=20[0-9]{2}-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]Z level=debug msg="tick" n=1'
  - name: unknown level
    env: {NOW: "2026-03-01T10:00:00Z"}
    args: [fatal, "oh no"]
    expected_stderr: "bad level: fatal"
    expected_exit: 2
  - name: field without equals sign
    env: {NOW: "2026-03-01T10:00:00Z"}
    args: [info, hello, justaword]
    expected_stderr: "bad field: justaword"
    expected_exit: 2
  - name: usage
    args: [info]
    expected_stderr: "usage: solution.sh LEVEL MESSAGE [key=value ...]"
    expected_exit: 2
