id: 383
module: 22
module_name: logging-monitoring-scripts
module_display: Logging & Monitoring
title: Timestamped Log Lines
difficulty: intermediate
xp: 130
story: |
  Welcome to the on-call rotation. Mara has pinned the first rule of the
  rota above your desk: "A log line without a time is gossip." The nightly
  backup script at Lanternfish currently prints bare sentences, so nobody can
  tell whether "snapshot finished" happened at supper time or at 3 a.m.
objective: |
  Write solution.sh that turns its arguments into one timestamped log line.

  Usage: solution.sh WHEN MESSAGE...

  - WHEN is either a Unix epoch (digits only) or the word `now`.
  - MESSAGE is every remaining argument, joined with single spaces.

  Print exactly one line on stdout:

      2026-03-01T10:00:00Z snapshot finished

  that is, the time as `YYYY-MM-DDThh:mm:ssZ` (UTC), a space, then the message.
  For `now` use the current time; for an epoch use that moment.
  With fewer than two arguments, or a WHEN that is neither `now` nor all
  digits, print `usage: solution.sh WHEN MESSAGE...` to stderr and exit 2.

  Format the time with Bash's own `printf '%(...)T'`; do not start `date`.
concepts:
  - "printf '%(format)T' epoch formats a time inside Bash"
  - "-1 means now"
  - "ISO 8601 UTC timestamps sort as text"
required_patterns:
  - pattern: "%\\(.*\\)T"
    message: "Format the time with printf '%(format)T' (a Bash builtin feature)."
forbidden_patterns:
  - pattern: '\bdate\b'
    message: "Use printf '%(...)T' instead of starting the date command."
test_cases:
  - name: a fixed moment
    args: ["1772359200", snapshot, finished]
    expected_stdout: "2026-03-01T10:00:00Z snapshot finished"
  - name: end of the year, message of several words
    args: ["1798761599", year, end, backup, "complete:", ok]
    expected_stdout: "2026-12-31T23:59:59Z year end backup complete: ok"
  - name: zero padding
    args: ["1783145109", cron, started]
    expected_stdout: "2026-07-04T06:05:09Z cron started"
  - name: now uses the current clock
    args: [now, "disk check done"]
    comparison: regex
    expected_stdout: '20[0-9]{2}-[01][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]Z disk check done'
  - name: message missing
    args: ["1772359200"]
    expected_stderr: "usage: solution.sh WHEN MESSAGE..."
    expected_exit: 2
  - name: when is not a time
    args: [yesterday, hello]
    expected_stderr: "usage: solution.sh WHEN MESSAGE..."
    expected_exit: 2
