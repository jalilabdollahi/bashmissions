id: 162
module: 9
module_name: arrays
module_display: Arrays & Maps
title: Remove an Item
difficulty: intermediate
xp: 120
story: |
  Five servers are racked in the east room, and this week some of them are
  being retired. Priya wants the retire script to remove them from the live
  inventory array, but she has seen scripts where removing the second machine
  made the old third machine "become" the second one and a whole wrong box
  got decommissioned. She wants to see exactly what the array looks like after
  each removal, indexes included.
objective: |
  Write solution.sh. It starts with this array:
    fleet=(anchovy barracuda cuttlefish dory eel)
  Each argument is an INDEX (0 to 4) of a machine to retire. Remove each
  of those elements from the array with `unset`. Indexes always refer to
  the original positions, so removing index 1 and then 3 must remove
  barracuda and dory, never anything else. Arguments are valid and
  distinct.
  When all are removed, print two lines:
    left: <number of elements remaining>
  and then the output of `declare -p fleet`.
  Example: `./solution.sh 1 3` prints
    left: 3
    declare -a fleet=([0]="anchovy" [2]="cuttlefish" [4]="eel")
  If there are no arguments, nothing is removed.
concepts:
  - "unset 'arr[i]' removes one element"
  - "the other indexes do not shift - the array gets a gap"
required_patterns:
  - pattern: "unset\\s+['\"]?\\w+\\[\\$?\\{?\\w+\\}?\\]['\"]?"
    message: "Remove an element with unset 'fleet[$i]' (quote it so the brackets are not treated as a glob)."
test_cases:
  - name: remove the middle two
    args: ["1", "3"]
    expected_stdout: |-
      left: 3
      declare -a fleet=([0]="anchovy" [2]="cuttlefish" [4]="eel")
  - name: remove the first
    args: ["0"]
    expected_stdout: |-
      left: 4
      declare -a fleet=([1]="barracuda" [2]="cuttlefish" [3]="dory" [4]="eel")
  - name: remove in odd order including the last
    args: ["4", "0", "2"]
    expected_stdout: |-
      left: 2
      declare -a fleet=([1]="barracuda" [3]="dory")
  - name: nothing to retire
    args: []
    expected_stdout: |-
      left: 5
      declare -a fleet=([0]="anchovy" [1]="barracuda" [2]="cuttlefish" [3]="dory" [4]="eel")
  - name: remove one in the middle
    args: ["2"]
    expected_stdout: |-
      left: 4
      declare -a fleet=([0]="anchovy" [1]="barracuda" [3]="dory" [4]="eel")
