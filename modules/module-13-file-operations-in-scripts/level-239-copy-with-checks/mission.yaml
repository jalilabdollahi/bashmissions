id: 239
module: 13
module_name: file-operations-in-scripts
module_display: Working with Files
title: Copy with Checks
difficulty: intermediate
xp: 130
story: |
  Theo's backup line was `cp db.dump /backups/` and he reported "done". On
  Monday the dump on the backup disk was 4 KB of a 900 MB file, because the
  disk had filled up halfway. cp had complained, but nobody was reading.
  Mara: "A copy that was not checked is a hope, not a backup."
objective: |
  Write solution.sh that takes a SOURCE file and a destination FOLDER and
  copies the file into the folder under the same name, carefully:

  1. SOURCE must be a readable regular file, otherwise print
     `cannot read SOURCE` to stderr and exit 1.
  2. FOLDER must be an existing directory, otherwise print
     `no such folder: FOLDER` to stderr and exit 1.
  3. If FOLDER already contains a file of that name, do not touch it: print
     `refusing to overwrite DEST` to stderr and exit 1 (DEST is the full
     path FOLDER/name).
  4. Copy with `cp`, then verify that the copy is byte-for-byte identical
     with `cmp -s`. If it is not, delete the bad copy, print
     `copy of SOURCE is corrupt, removed DEST` to stderr and exit 3.
  5. On success print `copied SOURCE -> DEST`.

  With the wrong number of arguments print `usage: solution.sh SOURCE FOLDER`
  to stderr and exit 2.
concepts:
  - "checking inputs before a copy"
  - "cmp -s verifies a copy"
required_patterns:
  - pattern: '\bcp\b'
    message: "Copy the file with cp."
  - pattern: '\bcmp\b'
    message: "Verify the copy with cmp -s source dest."
test_cases:
  - name: clean copy
    args: [dumps/db.dump, backup]
    files:
      dumps/db.dump: "CREATE TABLE customers;\nINSERT 1;\n"
      backup/older.dump: "old\n"
    expected_stdout: "copied dumps/db.dump -> backup/db.dump"
    expected_files:
      backup/db.dump: "CREATE TABLE customers;\nINSERT 1;"
      backup/older.dump: "old"
  - name: destination already has that name
    args: [report.csv, archive]
    files:
      report.csv: "new,data\n"
      archive/report.csv: "precious,old,data\n"
    expected_stderr: "refusing to overwrite archive/report.csv"
    expected_exit: 1
    expected_files:
      archive/report.csv: "precious,old,data"
  - name: truncated copy is detected and removed
    args: ["month end.sql", out]
    env:
      FAKE_CP_BAD: "1"
    files:
      "month end.sql": "a long and valuable dump\nwith several lines\n"
      out/keep.txt: "keep\n"
    expected_stderr: "copy of month end.sql is corrupt, removed out/month end.sql"
    expected_exit: 3
    expected_files:
      "out/month end.sql": null
      out/keep.txt: "keep"
  - name: empty file copies fine
    args: [empty.log, out]
    files:
      empty.log: ""
      out/.keep: ""
    expected_stdout: "copied empty.log -> out/empty.log"
    expected_files:
      out/empty.log: ""
  - name: source missing
    args: [nothing.txt, out]
    files:
      out/.keep: ""
    expected_stderr: "cannot read nothing.txt"
    expected_exit: 1
  - name: folder missing
    args: [a.txt, nowhere]
    files:
      a.txt: "a\n"
    expected_stderr: "no such folder: nowhere"
    expected_exit: 1
    expected_files:
      nowhere: null
  - name: wrong argument count
    args: [a.txt]
    expected_stderr: "usage: solution.sh SOURCE FOLDER"
    expected_exit: 2
