id: 154
module: 8
module_name: arithmetic
module_display: Arithmetic
title: Random in a Range
difficulty: intermediate
xp: 160
story: |
  Every customer's nightly backup used to start at exactly 02:00, and at
  02:00 exactly the whole harbour network ground to a halt. Mara's fix is
  "jitter": every job waits a random number of minutes before it begins, so the
  load spreads out. She needs a small generator that picks those delays from a
  range she chooses, and that can be replayed with a seed when someone asks
  "why did job 17 start so late?"
objective: |
  Write solution.sh that takes four whole numbers:
    $1  SEED   starting seed for Bash's random generator
    $2  LOW    smallest allowed delay in minutes (may be negative or zero)
    $3  HIGH   largest allowed delay (HIGH is at least LOW)
    $4  COUNT  how many delays to print (at least 1)

  First set RANDOM=$SEED so that the same arguments always give the same
  output. Then print COUNT lines, each one

    slot=<n>

  where n is a random whole number with LOW <= n <= HIGH, both ends included.
  Build n from $RANDOM and the % operator. (HIGH - LOW + 1 is at most 1000.)
concepts:
  - "$RANDOM"
  - "seeding with RANDOM=n"
  - "LOW + RANDOM % size"
required_patterns:
  - pattern: '\$RANDOM|\$\{RANDOM\}|\(\([^)]*\bRANDOM\b'
    message: "Draw the numbers from $RANDOM."
  - pattern: '%'
    message: "Squeeze $RANDOM into the range with the % operator."
  - pattern: 'RANDOM=[^=]'
    message: "Seed the generator first with RANDOM=<seed> so runs can be replayed."
forbidden_patterns:
  - pattern: '\b(shuf|jot|awk|od|cksum|date)\b'
    message: "Use Bash's own $RANDOM."
timeout: 10
test_cases:
  - name: backup jitter between 5 and 45
    args: ["42", "5", "45", "12"]
    comparison: regex
    expected_stdout: 'slot=-?[0-9]+(\nslot=-?[0-9]+){11}'
  - name: single possible value
    args: ["7", "30", "30", "5"]
    expected_stdout: |-
      slot=30
      slot=30
      slot=30
      slot=30
      slot=30
  - name: range that includes negative minutes
    args: ["123", "-10", "10", "20"]
    comparison: regex
    expected_stdout: 'slot=-?[0-9]+(\nslot=-?[0-9]+){19}'
  - name: tiny range must reach every value
    args: ["9", "1", "3", "90"]
    comparison: regex
    expected_stdout: 'slot=-?[0-9]+(\nslot=-?[0-9]+){89}'
  - name: from zero up
    args: ["2024", "0", "59", "30"]
    comparison: regex
    expected_stdout: 'slot=-?[0-9]+(\nslot=-?[0-9]+){29}'
