id: 451
module: 25
module_name: system-automation-scripts
module_display: Running the Fleet
title: Firewall Rule Audit
difficulty: expert
xp: 400
story: |
  Priya exports every host's firewall each night with iptables-save and
  files the text away. Nobody reads it, which is how a "temporary" rule
  opening the database port to the whole internet survived for eleven
  weeks. She hands you a sample export and a short list of things that must
  never appear in the INPUT chain, and asks for a checker that points at the
  offending line numbers.
objective: |
  Write solution.sh FILE. FILE is the output of `iptables-save` (see
  `fixtures/sample-rules.txt` for the shape). Report problems in the INPUT
  chain, in file order, one line each, using the line number inside FILE
  (counting every line, comments included).

  Rules to check:
  - A chain policy line `:INPUT ACCEPT [0:0]` (default-allow) gives
    `line N: INPUT policy is ACCEPT`
  - A rule `-A INPUT ... -j ACCEPT` that is open to the world, meaning it has
    no `-s` option or `-s 0.0.0.0/0`, and whose port selection
    (`--dport X` or `-m multiport --dports X,Y,...`) contains
      * a sensitive port (22, 3306, 5432 or 6379): `line N: port P open to the world`
        (one line per sensitive port in that rule, in the order written)
      * a range such as `8000:9000`: `line N: port range A:B open to the world`
    If such a world-open ACCEPT rule has no port selection and no `-i`, no
    `-p` and no `-m` option at all (it simply accepts everything), report
    `line N: accepts all traffic`.
  Rules in other chains (FORWARD, OUTPUT, ...) and rules that are not
  ACCEPT rules are ignored.

  Finally print `audited R rules, F findings` where R counts every `-A` line
  of any chain. Exit 1 if F is greater than 0, else 0.
  If FILE has no `*filter` line print `not an iptables-save export: FILE` to
  stderr and exit 1. Unreadable FILE: `cannot read FILE` (stderr, exit 1).
  No argument: `usage: solution.sh FILE` (stderr, exit 2).
concepts:
  - "parsing a structured text export field by field (awk)"
  - "iptables-save format: -A CHAIN options -j TARGET"
  - "audit rules as small predicates over parsed fields"
required_patterns:
  - pattern: '\bawk\b'
    message: "awk is the natural tool for walking the fields of each rule line."
test_cases:
  - name: a leaky ruleset
    args: [rules.txt]
    files:
      rules.txt: "# Generated by iptables-save v1.8.7 on Mon Mar  1 02:00:01 2026\n*filter\n:INPUT ACCEPT [0:0]\n:FORWARD DROP [0:0]\n:OUTPUT ACCEPT [0:0]\n-A INPUT -i lo -j ACCEPT\n-A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT\n-A INPUT -p tcp -m tcp --dport 22 -j ACCEPT\n-A INPUT -s 10.0.0.0/8 -p tcp -m tcp --dport 3306 -j ACCEPT\n-A INPUT -p tcp -m multiport --dports 80,443,5432 -j ACCEPT\n-A INPUT -s 0.0.0.0/0 -p tcp -m tcp --dport 8000:9000 -j ACCEPT\n-A INPUT -p icmp -j ACCEPT\n-A INPUT -j ACCEPT\n-A FORWARD -p tcp -m tcp --dport 22 -j ACCEPT\nCOMMIT\n"
    expected_stdout: |-
      line 3: INPUT policy is ACCEPT
      line 8: port 22 open to the world
      line 10: port 5432 open to the world
      line 11: port range 8000:9000 open to the world
      line 13: accepts all traffic
      audited 9 rules, 5 findings
    expected_exit: 1
  - name: the sample from the fixtures is clean
    args: [fixtures/sample-rules.txt]
    expected_stdout: "audited 4 rules, 0 findings"
  - name: restricted sources are fine, DROP rules are ignored
    args: [rules.txt]
    files:
      rules.txt: "*filter\n:INPUT DROP [0:0]\n-A INPUT -s 192.168.1.0/24 -p tcp -m tcp --dport 6379 -j ACCEPT\n-A INPUT -p tcp -m tcp --dport 22 -j DROP\n-A INPUT -s 10.1.2.3/32 -j ACCEPT\nCOMMIT\n"
    expected_stdout: "audited 3 rules, 0 findings"
  - name: explicit 0.0.0.0/0 counts as the world
    args: [rules.txt]
    files:
      rules.txt: "*filter\n:INPUT DROP [0:0]\n-A INPUT -s 0.0.0.0/0 -p tcp -m tcp --dport 6379 -j ACCEPT\n-A INPUT -s 0.0.0.0/0 -j ACCEPT\n-A INPUT -p tcp -m multiport --dports 3306,22,25 -j ACCEPT\nCOMMIT\n"
    expected_stdout: |-
      line 3: port 6379 open to the world
      line 4: accepts all traffic
      line 5: port 3306 open to the world
      line 5: port 22 open to the world
      audited 3 rules, 4 findings
    expected_exit: 1
  - name: a file that is not an export
    args: [rules.txt]
    files:
      rules.txt: "hello world\n"
    expected_stderr: "not an iptables-save export: rules.txt"
    expected_exit: 1
  - name: file missing
    args: [nope.txt]
    expected_stderr: "cannot read nope.txt"
    expected_exit: 1
  - name: no argument
    args: []
    expected_stderr: "usage: solution.sh FILE"
    expected_exit: 2
